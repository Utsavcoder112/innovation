<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nepali Food Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background-color: #f5f5f5;
        }
        .chat-container {
            max-width: 500px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chat-header {
            background-color: #d35400;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background-color: white;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #f1c40f;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background-color: #f0f0f0;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        #send-button {
            background-color: #d35400;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 20px;
            cursor: pointer;
        }
        #send-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .typing {
            font-style: italic;
            color: #888;
            padding: 10px;
            display: none;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Nepali Food Assistant</div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                Namaste! I'm your Nepali food assistant. Ask me anything about Nepali cuisine, recipes, ingredients, or cooking tips!
            </div>
        </div>
        <div class="typing" id="typing-indicator">Bot is typing...</div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off"/>
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const chatBox = document.getElementById('chat-box');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const typingIndicator = document.getElementById('typing-indicator');
            
            // Update API endpoint to match backend
            const API_ENDPOINT = 'http://localhost:8000/chat';
            
            // Generate a unique session ID for this chat session
            const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            function addMessage(message, isUser) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                messageDiv.textContent = message;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function showTyping(show) {
                typingIndicator.style.display = show ? 'block' : 'none';
                sendButton.disabled = show;
            }

            async function getChatbotResponse(userMessage) {
                try {
                    showTyping(true);
                    const response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ 
                            message: userMessage,
                            session_id: sessionId
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // Check if there's an error in the response
                    if (data.error) {
                        throw new Error(data.error + (data.details ? ': ' + data.details : ''));
                    }
                    
                    return data.response;
                } catch (error) {
                    console.error('Error:', error);
                    return `I'm having trouble connecting right now. Please make sure the backend server is running on port 8000. Error: ${error.message}`;
                } finally {
                    showTyping(false);
                }
            }

            async function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;
                
                addMessage(message, true);
                userInput.value = '';
                
                const botResponse = await getChatbotResponse(message);
                addMessage(botResponse, false);
            }

            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter' && !sendButton.disabled) {
                    sendMessage();
                }
            });
            
            // Focus on input when page loads
            userInput.focus();
        });
    </script>
</body>
</html>
